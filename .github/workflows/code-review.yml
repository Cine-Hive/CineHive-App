name: AI CodeMentor Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Cine-Hive/MyCodeMentor@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
