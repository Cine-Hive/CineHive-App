# PR 템플릿 자동 적용 워크플로우
#
# 이 워크플로우는 PR이 새로 생성될 때 자동으로 실행되어
# PR 설명을 pull_request_template.md의 내용으로 업데이트합니다.
# 이를 통해 커밋 메시지가 PR 설명에 자동으로 추가되는 것을 방지하고
# 항상 깔끔한 템플릿만 표시되도록 합니다.

name: Update PR Template

# 워크플로우 트리거 설정
# PR이 새로 생성될 때만 실행됩니다.
on:
  pull_request:
    types: [opened]

jobs:
  update-pr-description:
    # Ubuntu 최신 환경에서 실행
    runs-on: ubuntu-latest
    
    # PR 내용 업데이트를 위한 읽기/쓰기 권한 설정
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      # 1. 코드베이스 체크아웃
      # PR 템플릿 파일에 접근하기 위해 필요합니다.
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. PR 설명 업데이트
      # GitHub CLI를 사용하여 PR 설명을 템플릿 내용으로 교체합니다.
      - name: Update PR Description
        run: |
          # PR 번호로 PR을 식별하고, 템플릿 파일 내용으로 PR 설명을 업데이트합니다.
          gh pr edit "${{ github.event.pull_request.number }}" --body "$(cat .github/pull_request_template.md)"
        env:
          # GitHub 토큰은 PR 편집 권한을 제공합니다.
          # 이 토큰은 GitHub Actions에서 자동으로 제공됩니다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
